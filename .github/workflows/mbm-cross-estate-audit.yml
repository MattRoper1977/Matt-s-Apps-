name: Sync proven MBM shared hub checks into Apps

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbm-cross-estate-apps-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BRANCH: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
    steps:
      - name: Check out the authorised Apps branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
          fetch-depth: 0

      - name: Check out the proven Lessons shared layer
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
          path: _reference/lessons
          fetch-depth: 1

      - name: Synchronise shared assets and verifiers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          cp _reference/lessons/assets/mbm-hub.css assets/mbm-hub.css
          cp _reference/lessons/tools/verify_cross_estate_unification.py tools/verify_cross_estate_unification.py
          cp _reference/lessons/tools/verify_cross_estate_browser.mjs tools/verify_cross_estate_browser.mjs
          git add assets/mbm-hub.css tools/verify_cross_estate_unification.py tools/verify_cross_estate_browser.mjs
          node --check tools/verify_cross_estate_browser.mjs
          python -m py_compile tools/verify_cross_estate_unification.py
          if git diff --cached --quiet; then
            echo "Shared layer already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "Made by Matt cross-estate sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test: sync cross-estate browser diagnostics"
          git push origin "HEAD:$BRANCH"
