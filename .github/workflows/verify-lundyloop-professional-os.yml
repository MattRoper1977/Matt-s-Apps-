name: Verify LundyLoop Professional OS

on:
  pull_request:
    branches: [main]
    paths:
      - 'LundyLoop_Professional_OS.html'
      - 'LundyLoop_Professional_OS/**'
      - '_release-docs/lundyloop-professional-os-v2/**'
      - 'apps.json'
      - 'index.html'
      - 'tools/lundyloop/**'
      - 'tools/verify_cross_estate_unification.py'
      - '.github/workflows/verify-lundyloop-professional-os.yml'
  push:
    branches: [main]
    paths:
      - 'LundyLoop_Professional_OS.html'
      - 'LundyLoop_Professional_OS/**'
      - '_release-docs/lundyloop-professional-os-v2/**'
      - 'apps.json'
      - 'index.html'
      - 'tools/lundyloop/**'
      - 'tools/verify_cross_estate_unification.py'
      - '.github/workflows/verify-lundyloop-professional-os.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Education Pages publication"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lundyloop-professional-os-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.action == 'completed' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # The static verifier's forbidden-artefact sweep walks the whole tree, so it
      # must run BEFORE the site reference checkout lands in _reference/site —
      # otherwise it flags the site's own webmanifest/media as production artefacts.
      # (Found on this workflow's first real CI run; the package was built without CI.)
      - name: Static payload, catalogue, links and JavaScript
        run: python3 tools/lundyloop/verify_lundyloop_static.py . --self-test --json-out audit-output/lundyloop/static.json
      - name: Resolve this publication's immutable builder
        id: builder
        run: echo "ref=$(python3 tools/lundyloop/verify_live_bytes.py --print-builder-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ steps.builder.outputs.ref }}
          path: _reference/site
      - name: Published-byte firing and provenance controls
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/lundyloop/test_live_bytes.py
          PYTHONPATH=_reference/site/tools python3 -m unittest test_published_site.ProvenanceControls
      - name: Existing Apps cross-estate gate
        run: |
          git fetch origin main
          python3 tools/verify_cross_estate_unification.py --base origin/main --canonical _reference/site --self-test
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lundyloop-http.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Browser workflow and Apps-card proof
        run: node tools/lundyloop/verify_lundyloop_browser.mjs --base http://127.0.0.1:4173/ --artifacts audit-output/lundyloop
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lundyloop-professional-os-${{ github.run_id }}
          path: audit-output/lundyloop/
          if-no-files-found: error
          retention-days: 30

  live-bytes:
    if: github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Resolve this publication's immutable builder
        id: builder
        run: echo "ref=$(python3 tools/lundyloop/verify_live_bytes.py --print-builder-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ steps.builder.outputs.ref }}
          path: _reference/site
      - name: Exact published-byte proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 tools/lundyloop/verify_live_bytes.py \
            --repo-root . \
            --base https://madebymatt.uk/Matt-s-Apps-/ \
            --sha "$PUBLICATION_SOURCE_SHA" \
            --json-out live-proof.json
      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lundyloop-live-${{ github.run_id }}
          path: live-proof.json
          if-no-files-found: error
