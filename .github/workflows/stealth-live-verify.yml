name: Stealth Science served-bytes + origin drive

# The live leg for this repository's published pages, run from a GitHub runner
# because the development container cannot reach madebymatt.uk (the egress
# proxy answers 403 on CONNECT — measured, not assumed).
#
# READ-ONLY against production. Two halves, and the order matters:
#
#   1. served bytes == committed bytes, per changed file, with a
#      nonexistent-path control that must 404 — a 200 proves a response,
#      not the right response, so the hashes are the assertion;
#   2. only after the bytes match, the pages are DRIVEN on the origin:
#      splash once + Skip + estate back chip per page, both hub frames
#      READY v4.0 with no framed splash, and a real MBM3 code generated by
#      the real ORBIT teacher panel imported into the real hub — wrong PIN
#      first (rejected, no record), right PIN second (one record).
#
# "Merged" and "served" are different claims; the word "live" is earned by
# this workflow's green, never by a local pass.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Space-separated repo files to prove served, e.g. "orbit-vector-diagnostic.html apps.json"'
        required: false
        default: 'orbit-vector-diagnostic.html enzyme-reactor-overdrive.html mbm-master-hub.html apps.json index.html'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main (the deployed tree)
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }

      - name: Served bytes match the committed bytes, control must 404
        shell: bash
        run: |
          set -euo pipefail
          echo "deployed tree: $(git rev-parse HEAD)"
          fail=0
          for f in ${{ inputs.paths || 'orbit-vector-diagnostic.html enzyme-reactor-overdrive.html mbm-master-hub.html apps.json index.html' }}; do
            want=$(sha256sum "$f" | cut -d' ' -f1)
            got=$(curl -fsS --retry 3 -H 'Cache-Control: no-cache' "https://madebymatt.uk/Matt-s-Apps-/$f?mbm=$GITHUB_RUN_ID" | sha256sum | cut -d' ' -f1) || got=FETCH_FAILED
            if [ "$want" = "$got" ]; then
              printf '  PASS  identical  %s  %s\n' "${want:0:16}" "$f"
            else
              printf '  FAIL  %s: committed %s served %s\n' "$f" "${want:0:16}" "${got:0:16}"
              fail=1
            fi
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://madebymatt.uk/Matt-s-Apps-/this-file-does-not-exist-$GITHUB_RUN_ID.html" || echo 000)
          if [ "$code" = "404" ]; then
            echo "  PASS  control: nonexistent path answers 404 — the comparison can fail"
          else
            echo "  FAIL  control answered $code; the hashes above prove nothing"
            fail=1
          fi
          exit $fail

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm i --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Drive the pages on the real origin
        shell: bash
        run: |
          set -euo pipefail
          node tools/stealth_live_drive.mjs --base https://madebymatt.uk/Matt-s-Apps-/
