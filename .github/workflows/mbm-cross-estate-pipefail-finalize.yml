name: Prepare Apps live-poll pipefail correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mbm-cross-estate-apps-pipefail-payload
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-cross-estate-pipefail-poll-fix-2026-08-08
          fetch-depth: 0

      - name: Build and publish chunked workflow payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/mbm-cross-estate-unification.yml')
          text = path.read_text(encoding='utf-8')
          old = """            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \"$versioned\" | grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08'; then"""
          new = """            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -o /tmp/mbm-live-index.html \"$versioned\" && grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08' /tmp/mbm-live-index.html; then"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one pipefail-unsafe probe, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq -- "-o /tmp/mbm-live-index.html \"\$versioned\" && grep -q" .github/workflows/mbm-cross-estate-unification.yml
          rm -f .github/mbm-cross-estate-workflow-payload.b64 .github/mbm-cross-estate-workflow-payload.part-*
          base64 -w0 .github/workflows/mbm-cross-estate-unification.yml | split -b 3000 -d -a 2 - .github/mbm-cross-estate-workflow-payload.part-
          git checkout -- .github/workflows/mbm-cross-estate-unification.yml
          git config user.name "Made by Matt cross-estate release"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/mbm-cross-estate-workflow-payload*
          if git diff --cached --quiet; then
            echo 'Chunked payload already current.'
            exit 0
          fi
          git commit -m "chore: stage chunked Apps workflow payload"
          git push origin HEAD:codex/mbm-cross-estate-pipefail-poll-fix-2026-08-08
