name: Finalise Apps live-proof broken-pipe fix

on:
  push:
    branches:
      - codex/mbm-live-proof-broken-pipe-fix-2026-08-08
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mbm-apps-live-proof-broken-pipe-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-live-proof-broken-pipe-fix-2026-08-08
          fetch-depth: 0

      - name: Replace the vacuous curl-to-grep pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/mbm-cross-estate-unification.yml')
          text = path.read_text(encoding='utf-8')
          old = "            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \"$versioned\" | grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08'; then"
          new = "            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -o /tmp/mbm-deployment.html \"$versioned\" && grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08' /tmp/mbm-deployment.html; then"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one vulnerable pipeline, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq -- '-o /tmp/mbm-deployment.html "$versioned" && grep -q' .github/workflows/mbm-cross-estate-unification.yml
          ! grep -Fq -- '"$versioned" | grep -q' .github/workflows/mbm-cross-estate-unification.yml

          printf '%s\n' 'mbm-cross-estate-unification-lessons-apps-2026-08-08' >/tmp/mbm-positive.html
          grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08' /tmp/mbm-positive.html
          printf '%s\n' 'deliberately missing marker' >/tmp/mbm-negative.html
          if grep -q 'mbm-cross-estate-unification-lessons-apps-2026-08-08' /tmp/mbm-negative.html; then
            echo 'negative control was not detected' >&2
            exit 1
          fi

          rm -f .github/workflows/mbm-fix-live-proof-broken-pipe.yml
          git diff --check

      - name: Commit the permanent verifier repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Made by Matt release repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: make Apps deployment polling pipe-safe'
          git push origin HEAD:codex/mbm-live-proof-broken-pipe-fix-2026-08-08
